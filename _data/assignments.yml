# One entry per problem set or project milestone. Drives the Assignments
# page, the Project page's milestone table, and the "Out"/"Due" labels on
# the Schedule. Dates are YYYY-MM-DD; items move from Upcoming to Past the
# day after they are due.
#
#   type:   ps | project | participation (participation items have no release
#           date: they are available from the start of the quarter)
#   project: true on a participation item that also belongs in the Project
#           page's milestone table
#   weight: share of the final project grade (project milestones only)
#   link:   handout URL (Canvas, Gradescope, or a file in this repo); "" if not released
#   late_until: optional. Last day late work is accepted, overriding the
#           course-wide grace period (grace_days in _config.yml). Use "none"
#           for deadlines with no late submissions, such as in-class work.

